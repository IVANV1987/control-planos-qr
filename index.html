<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTILLEAN · Control documental</title><style>body{font-family:system-ui,Arial;background:#eef2f6;margin:0;padding:25px;color:#203247}.card{background:white;max-width:540px;margin:50px auto;padding:30px;border-radius:16px;box-shadow:0 3px 18px #0013}header{font-size:20px;font-weight:750;color:#153e61}small{color:#68788b}.rev{font-size:50px;color:#176b40;font-weight:800}.row{margin-top:19px;border-top:1px solid #e7edf3;padding-top:15px;overflow-wrap:anywhere}.state{font-weight:600}#error{color:#a12b27}</style></head><body><main class="card"><header>ANTILLEAN · CONTROL DOCUMENTAL</header><p><small>Consulta de la revisión registrada</small></p><p id="error">Consultando…</p><div id="datos" hidden><div class="row"><small>PROYECTO</small><div id="proyecto"></div></div><div class="row"><small>CÓDIGO ACTUAL</small><div id="codigo"></div></div><div class="row"><small>DESCRIPCIÓN</small><div id="descripcion"></div></div><div class="row"><small>ÚLTIMA REVISIÓN REGISTRADA</small><div class="rev" id="revision"></div></div><div class="row"><small>ESTADO</small><div class="state" id="estado"></div></div><div class="row"><small id="actualizado"></small></div></div><p><small>Verifique además la aprobación documental antes de usar un plano para construcción.</small></p></main><script>async function cargar(){const id=new URLSearchParams(location.search).get('id');const error=document.getElementById('error');try{if(!id)throw Error('Escanee un QR válido.');const r=await fetch('planos.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Servicio de consulta no disponible.');const data=await r.json();let fecha=new Date(data.actualizado);if(!Number.isFinite(fecha.getTime())||Date.now()-fecha.getTime()>60*60*1000)throw Error('Los datos no han sido actualizados recientemente. No se puede verificar la revisión vigente.');const p=data.planos[id];if(!p)throw Error('El documento no aparece publicado o su código ha cambiado.');for(const k of ['proyecto','codigo','descripcion','revision','estado'])document.getElementById(k).textContent=p[k]||'No informado';document.getElementById('actualizado').textContent='Última sincronización: '+fecha.toLocaleString('es-DO');error.hidden=true;document.getElementById('datos').hidden=false;}catch(e){error.textContent=e.message;}}cargar();</script></body></html>
