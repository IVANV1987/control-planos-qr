name: .github/workflows/publicar.yml
on:
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publicar-qr
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - name: Leer Excel privado y filtrar publicación
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_DRIVE_ID: ${{ secrets.MS_DRIVE_ID }}
          MS_ITEM_ID: ${{ secrets.MS_ITEM_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: python sincronizar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
